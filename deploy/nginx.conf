user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;
events { worker_connections 768; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/nginx/dnd-access.log;
    limit_req_zone $binary_remote_addr zone=dnd_api:10m rate=5r/s;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 80 default_server;
        server_name dnd.blockerbunch.com;
        # Created only when the user authorizes external application access.
        if (!-f /etc/dnd-builder/public-enabled) { return 503; }
        include /etc/dnd-builder/locations.conf;
    }
    # SSH-only acceptance test endpoint. Never reachable from LAN/tunnel.
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        # Origin rewrite applies only on this loopback test listener.
        set $dnd_test_origin https://dnd.blockerbunch.com;
        include /etc/dnd-builder/test-locations.conf;
    }
}
